name: Security and billing regression
on:
  push:
  pull_request:
jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agent
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsodium-dev libpq-dev pkg-config
      - name: Install test dependencies
        run: |
          Rscript -e 'packages <- c("digest","dplyr","tidyr","RPostgres","sodium"); install.packages(packages, repos="https://cloud.r-project.org"); missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly=TRUE)]; if (length(missing)) stop("Missing test packages: ", paste(missing, collapse=", "))'
      - name: Run deterministic regression suite
        run: Rscript tests/regression.R
      - name: Check shell syntax
        run: bash -n entrypoint.sh
      - name: Prepare disposable test database
        run: psql -h localhost -p 55432 -U agent -d postgres -v ON_ERROR_STOP=1 -f schema.sql -f tests/migration_seed.sql -f migrations/001_commercial_security.sql
      - name: Run database regression
        env:
          PUGA_TEST_DATABASE: local-disposable
          PUGA_TEST_DRIVER: RPostgres
        run: Rscript tests/database.R

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agent
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag pugaxtrade:ci .
      - name: Start application with disposable database
        run: |
          docker run -d --name puga-ci --network host \
            -e PGHOST=127.0.0.1 -e PGPORT=55432 -e PGDATABASE=postgres \
            -e PGUSER=agent -e PGPASSWORD=disposable-ci-only -e PGSSLMODE=disable \
            -e PUBLIC_BASE_URL=https://fixture.example.invalid pugaxtrade:ci
      - name: Verify application and migrated database
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:3838/healthz > /tmp/puga-health; then
              curl -fsS http://localhost:3838/ > /tmp/puga-page
              grep -qi 'shiny' /tmp/puga-page
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Container diagnostics
        if: always()
        run: |
          docker logs puga-ci 2>&1 || true
          docker exec puga-ci sh -c 'cat /var/log/shiny-server/*.log' 2>&1 || true
      - name: Remove test container
        if: always()
        run: docker rm -f puga-ci || true
