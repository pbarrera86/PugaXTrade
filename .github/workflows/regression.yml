name: Security and billing regression
on:
  push:
  pull_request:
jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agent
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsodium-dev libpq-dev pkg-config
      - name: Install test dependencies
        run: |
          Rscript -e 'packages <- c("digest","dplyr","tidyr","RPostgres","sodium"); install.packages(packages, repos="https://cloud.r-project.org"); missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly=TRUE)]; if (length(missing)) stop("Missing test packages: ", paste(missing, collapse=", "))'
      - name: Run deterministic regression suite
        run: Rscript tests/regression.R
      - name: Check browser auth routes
        run: node --test tests/auth_routes.js
      - name: Check shell syntax
        run: bash -n entrypoint.sh
      - name: Prepare disposable test database
        run: psql -h localhost -p 55432 -U agent -d postgres -v ON_ERROR_STOP=1 -f schema.sql -f tests/migration_seed.sql -f migrations/001_commercial_security.sql
      - name: Run database regression
        env:
          PUGA_TEST_DATABASE: local-disposable
          PUGA_TEST_DRIVER: RPostgres
        run: Rscript tests/database.R

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agent
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated staging configuration
        env:
          STAGING_DB_PASSWORD: disposable-ci-only
          STAGING_PUBLIC_BASE_URL: https://fixture.example.invalid
        run: docker compose -f compose.staging.yml config --quiet
      - name: Build production image
        run: docker build --tag pugaxtrade:ci .
      - name: Start application with disposable database
        run: |
          docker run -d --name puga-ci --network host \
            -e PGHOST=127.0.0.1 -e PGPORT=55432 -e PGDATABASE=postgres \
            -e PGUSER=agent -e PGPASSWORD=disposable-ci-only -e PGSSLMODE=disable \
            -e PUBLIC_BASE_URL=http://localhost:3838 -e STRIPE_WEBHOOK_SECRET=whsec_ci_only pugaxtrade:ci
      - name: Verify application and migrated database
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:3838/healthz > /tmp/puga-health; then
              curl -fsS http://localhost:3838/ > /tmp/puga-page
              grep -qi 'shiny' /tmp/puga-page
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Verify dynamic POST routes bypass static files
        run: |
          payload='{"id":"evt_ci_transport","type":"pugaxtrade.transport_check","livemode":false}'
          stamp=$(date +%s)
          signature=$(printf '%s' "$stamp.$payload" | openssl dgst -sha256 -hmac whsec_ci_only | awk '{print $NF}')
          status=$(curl -sS -o /tmp/puga-post -w '%{http_code}' http://localhost:3838/webhook -H "Stripe-Signature: t=$stamp,v1=$signature" -H 'Content-Type: application/json' --data "$payload")
          echo "Signed webhook HTTP $status"
          test "$status" = 200
          status=$(curl -sS -o /tmp/puga-invalid -w '%{http_code}' http://localhost:3838/webhook -H 'Stripe-Signature: t=0,v1=invalid' --data '{}')
          echo "Invalid signature HTTP $status"
          test "$status" = 401
          status=$(curl -sS -o /tmp/puga-auth -w '%{http_code}' http://localhost:3838/auth/set-session --data 'code=invalid')
          echo "Missing auth origin HTTP $status"
          test "$status" = 403
      - name: Install browser test runtime
        run: |
          npm install --prefix /tmp/puga-browser --no-package-lock playwright
          /tmp/puga-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify browser form origin and auth responses
        env:
          NODE_PATH: /tmp/puga-browser/node_modules
        run: node tests/browser_auth_flow.cjs
      - name: Container diagnostics
        if: always()
        run: |
          docker logs puga-ci 2>&1 || true
          docker exec puga-ci sh -c 'cat /var/log/shiny-server/*.log' 2>&1 || true
      - name: Remove test container
        if: always()
        run: docker rm -f puga-ci || true
