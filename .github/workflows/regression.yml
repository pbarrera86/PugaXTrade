name: Security and billing regression
on:
  push:
  pull_request:
jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agent
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U agent"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
      - name: Install test dependencies
        run: Rscript -e 'install.packages(c("digest","dplyr","tidyr","RPostgres","sodium"), repos="https://cloud.r-project.org")'
      - name: Run deterministic regression suite
        run: Rscript tests/regression.R
      - name: Check shell syntax
        run: bash -n entrypoint.sh
      - name: Prepare disposable test database
        run: psql -h localhost -p 55432 -U agent -d postgres -v ON_ERROR_STOP=1 -f schema.sql -f tests/migration_seed.sql -f migrations/001_commercial_security.sql
      - name: Run database regression
        env:
          PUGA_TEST_DATABASE: local-disposable
          PUGA_TEST_DRIVER: RPostgres
        run: Rscript tests/database.R
