# ── PugaX Trade — docker-compose.yml ─────────────────────────────────────────
services:
  migrate:
    image: pugaxtrade:latest
    restart: "no"
    working_dir: /srv/shiny-server/app
    command: ["Rscript", "db_init.R"]
    environment:
      PGHOST: ${PGHOST}
      PGPORT: ${PGPORT}
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PG_MIGRATOR_USER:-${PGUSER}}
      PGPASSWORD: ${PG_MIGRATOR_PASSWORD:-${PGPASSWORD}}
      PGSSLMODE: ${PGSSLMODE}
    networks: [dokploy-network]
    healthcheck:
      disable: true
  pugaxtrade:
    build:
      context: .
      dockerfile: Dockerfile
    image: pugaxtrade:latest
    container_name: pugaxtrade_app
    restart: unless-stopped
    mem_limit: 4g
    cpus: 1.5
    pids_limit: 256

    ports:
      - "127.0.0.1:3838:3838"

    networks:
      - dokploy-network

    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: &app_environment
      PUGA_RUN_MIGRATIONS: "false"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID}
      STRIPE_ALLOW_TEST: ${STRIPE_ALLOW_TEST}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}

      PGHOST: ${PGHOST}
      PGPORT: ${PGPORT}
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGSSLMODE: ${PGSSLMODE}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_ADMIN: ${SMTP_ADMIN_EMAIL}

      # Seguridad: Admin y config de negocio fuera del código fuente
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      DEFAULT_REFERRER_USERNAME: ${DEFAULT_REFERRER_USERNAME}
      REFERRAL_COMMISSION_AMOUNT: ${REFERRAL_COMMISSION_AMOUNT:-9.00}

    volumes:
      - shiny_logs:/var/log/shiny-server

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Host: localhost' http://127.0.0.1:3838/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  email-worker:
    image: pugaxtrade:latest
    restart: unless-stopped
    init: true
    mem_limit: 512m
    cpus: 0.25
    pids_limit: 64
    working_dir: /srv/shiny-server/app
    command: ["Rscript", "scripts/email_worker.R"]
    environment: *app_environment
    depends_on:
      pugaxtrade:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/puga-email-worker-heartbeat -mmin -2 -print -quit 2>/dev/null)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - dokploy-network

volumes:
  shiny_logs:

networks:
  dokploy-network:
    external: true
